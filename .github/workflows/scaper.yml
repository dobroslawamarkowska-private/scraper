name: Weekly Scraper

on:
  schedule:
    - cron: "0 6 * * 1"  # co poniedziałek o 6:00 UTC
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        city: [lodz, krakow]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scaper.py --city ${{ matrix.city }} --pages 8 --output data/ogloszenia_${{ matrix.city }}.csv

      - name: Upload scraped data
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.city }}
          path: data/ogloszenia_${{ matrix.city }}.csv

  commit-changes:
    runs-on: ubuntu-latest
    needs: run-scraper
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Download all scraped data
        uses: actions/download-artifact@v4
        with:
          pattern: data-*
          merge-multiple: true
          path: data

      - name: Commit changes
        env:
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          git config --global user.name "${GIT_USER_NAME:-github-actions[bot]}"
          git config --global user.email "${GIT_USER_EMAIL:-github-actions[bot]@users.noreply.github.com}"
          
          # Configure remote URL with token for authentication
          git remote set-url origin https://${PERSONAL_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          
          git add -f data/*.csv
          git commit -m "Update scraped data [$(date +'%Y-%m-%d %H:%M:%S')]" || echo "No changes to commit"
          git push
